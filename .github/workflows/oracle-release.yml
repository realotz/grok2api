name: Oracle ARM64 Release

on:
  workflow_dispatch:
  push:
    tags:
      - "oracle-v*"

permissions:
  contents: read

concurrency:
  group: oracle-grok2api-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'realotz/grok2api' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/oracle-v'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release source
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == tag && ! "$REF_NAME" =~ ^oracle-v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid Oracle release tag" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'SOURCE_SHA256=%s\n' "$(git archive HEAD | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Build ARM64 image
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/realotz/grok2api:sha-$SOURCE_REVISION"
          docker buildx build --platform linux/arm64 --load --file Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/realotz/grok2api" \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            --label "io.grok2api.source-sha256=$SOURCE_SHA256" \
            --tag "$image" .
          [[ "$(docker image inspect "$image" --format '{{.Architecture}}')" == arm64 ]]

      - name: Publish immutable image
        id: image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          image="ghcr.io/realotz/grok2api:sha-$SOURCE_REVISION"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          [[ "$digest" =~ ^ghcr\.io/realotz/grok2api@sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Image: `%s`\nSource: `%s`\n' "$digest" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Oracle
        env:
          IMAGE: ${{ steps.image.outputs.digest }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/oracle-grok2api"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/oracle-grok2api"; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" |
            ssh -T -i "$HOME/.ssh/oracle-grok2api" -p "${ORACLE_PORT:-22}" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              "$ORACLE_USER@$ORACLE_HOST" "deploy $IMAGE"
          printf 'Oracle deployed `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
